  <link

  <!-- Custom CSS -->

        <span class="navbar-toggler-icon"></span>

      </button>

      <div
        class="collapse navbar-collapse"
        id="navbarMenu"
      >

        <ul
          class="navbar-nav ms-auto align-items-lg-center"
        >

          <li class="nav-item">
            <a
              class="nav-link active"
              href="#home"
            >
              Home
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="#expertise"
            >
              Expertise
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="#skills"
            >
              Skills
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="#projects"
            >
              Projects
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="#contact"
            >
              Contact
            </a>
          </li>

          <!-- Theme Button -->

          <li class="nav-item ms-lg-3 mt-3 mt-lg-0">

            <button
              id="themeToggle"
              class="theme-btn"

              <i class="bi bi-moon-stars-fill"></i>

            </button>

          </li>

        </ul>

      </div>

    </div>

  </nav>

  <!-- =========================
       HERO SECTION
  ========================== -->

  <section
    id="home"
    class="hero-section"
  >

    <div class="container">

      <div
        class="row align-items-center min-vh-100"
      >

        <!-- Left -->

        <div
          class="col-lg-6 text-center text-lg-start"
        >

          <h1 class="hero-title">

            Hi, I'm
            <span id="heroName"></span>

          </h1>

          <h2 class="typing-text mt-3">

            I am a
            <span id="typing"></span>

          </h2>

          <p
            class="hero-desc mt-4"
            id="heroDesc"
          ></p>

          <div
            class="mt-4 d-flex gap-3 justify-content-center justify-content-lg-start flex-wrap"
          >

            <a
              href="#projects"
              class="btn btn-primary custom-btn"
            >
              View Projects
            </a>

            <a
              href="#contact"
              class="btn btn-outline-light custom-btn"
            >
              Contact Me
            </a>

          </div>

          <!-- Social Icons -->

          <div class="social-icons mt-4" style="display:none;"></div>

        </div>

        <!-- Right -->

        <div
          class="col-lg-6 text-center mt-5 mt-lg-0"
        >

          <div class="profile-wrapper">

            <img
              src="assets/images/profileimg.jpeg"
              alt="Profile"
              class="profile-img img-fluid float-img"
            >

          </div>

        </div>

      </div>

    </div>

  </section>

  ========================== -->

  </section>

  <!-- =========================
       SKILLS
  ========================== -->

  <section
    id="skills"
    class="section-padding"
  >

    <div class="container">

      <h2

      <div class="row justify-content-center">

       PROJECTS
  ========================== -->

        Projects

        class="row g-4"

    </div>

  </section>

     CONTACT
========================== -->

<section

        <!-- Email Button -->

  <a
  href="https://mail.google.com/mail/?view=cm&fs=1&to=mahtorakeshkumar926@gmail.com&su=Portfolio%20Inquiry&body=Hello%20Rakesh,%0A%0AI%20want%20to%20connect%20with%20you."
  target="_blank"
  class="btn btn-primary custom-btn"
>

</a>

        <!-- Resume Button -->

        <a
          href="https://rakeshk-resume.vercel.app/"

</section>

    <div class="container">

      <div
        class="footer-social-icons mb-4"

        <a
          href="https://github.com/Rakesh-Kumar2006"

        >
          <i class="bi bi-github"></i>
        </a>

        <a
          href="https://www.linkedin.com/in/rakesh-kumar-mahto-542154376"
          target="_blank"
